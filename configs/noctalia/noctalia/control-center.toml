# Control Center — sidebar, shortcuts

[control_center]
sidebar         = "compact"       # full | compact | none
sidebar_section = "compact"

# Shortcut buttons on Home tab (max 6 shown, order preserved)
[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "wallpaper"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "nightlight"