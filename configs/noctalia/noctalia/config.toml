# Noctalia v5 — entry point
# Files are loaded in order; later includes override earlier ones.
# This file's own settings override all includes.

[include]
autoload = false
files = [
    "theme.toml",
    "shell.toml",
    "keybinds.toml",
    "bar.toml",
    "services.toml",
    "control-center.toml",
    "desktop.toml",
    "dock.toml",
]

# ── Hooks ───────────────────────────────────────────
# Uncomment and fill in to enable:
#
# [hooks]
# started             = ""
# wallpaper_changed    = ""
# colors_changed       = ""
# theme_mode_changed   = ""
# session_locked       = ""
# session_unlocked     = ""
# battery_percentage_changed = ""