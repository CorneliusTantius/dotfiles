# Services — audio, brightness, idle, location, nightlight, notifications, sysmon

# ── Audio ──────────────────────────────────────────
[audio]
enable_overdrive    = false
enable_sounds       = false
sound_volume        = 0.5
volume_change_sound = ""
notification_sound  = ""

# ── Brightness ─────────────────────────────────────
[brightness]
enable_ddcutil     = false
ignore_mmids       = []
minimum_brightness = 0.0
sync_all_monitors  = false

# ── Idle ───────────────────────────────────────────
[idle]
pre_action_fade_seconds = 2.0

[idle.behavior.lock]
timeout = 660
action  = "lock"
enabled = false

[idle.behavior.screen-off]
timeout = 600
action  = "screen_off"
enabled = false

[idle.behavior.suspend]
timeout = 1800
action  = "lock_and_suspend"
enabled = false

# ── Location ───────────────────────────────────────
[location]
auto_locate = false
address     = ""

# ── Night Light ────────────────────────────────────
[nightlight]
enabled           = false
force             = false
temperature_day   = 6500
temperature_night = 4000

# ── Notifications ──────────────────────────────────
[notification]
enable_daemon       = true
show_app_name       = true
show_actions        = true
position            = "top_right"
layer               = "top"
scale               = 1.0
background_opacity  = 0.97
border              = true
offset_x            = 20
offset_y            = 8
monitors            = []
collapse_on_dismiss = true

# ── System Monitor ─────────────────────────────────
[system.monitor]
enabled              = true
cpu_poll_seconds     = 2.0
gpu_poll_seconds     = 0.0        # disabled — avoid waking dGPU
memory_poll_seconds  = 2.0
network_poll_seconds = 3.0
disk_poll_seconds    = 10.0
cpu_temp_sensor_path = ""