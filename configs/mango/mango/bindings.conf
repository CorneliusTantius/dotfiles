# ───────────────────────────────────────────────────
# Key bindings — window management + Noctalia v5 IPC
# ───────────────────────────────────────────────────

# ── Reload / quit ──────────────────────────────────
bind=SUPER+ALT,r,reload_config
bind=SUPER+ALT,m,quit

# ── Apps ───────────────────────────────────────────
bind=SUPER,Return,spawn,alacritty
bind=SUPER,e,spawn,nautilus

# Fallback launcher (rofi)
bind=ALT,space,spawn,rofi -show drun

# ── Noctalia v5 IPC ────────────────────────────────
# Launcher
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher

# Control Center (right-click on bar also works)
# bind=SUPER,s,spawn,noctalia msg panel-toggle control-center

# Settings
# bind=SUPER,comma,spawn,noctalia msg settings-toggle

# Lock screen
bind=SUPER,escape,spawn,noctalia msg session lock

# Session (power) menu
# bind=SUPER+SHIFT,q,spawn,noctalia msg panel-toggle session

# Alt+Tab — toggle between the 2 virtual desktops (previous tagset)
bind=ALT,Tab,view,-1

# Screenshots
bind=ALT+SHIFT,1,spawn,noctalia msg screenshot-region
bind=ALT+SHIFT,2,spawn,noctalia msg screenshot-screen
bind=ALT+SHIFT,3,spawn,noctalia msg screenshot-window

# Clipboard
# bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard

# Media keys — Noctalia v5 handles volume, brightness, and media via bar widget actions


# ── Window management ──────────────────────────────
bind=SUPER,Q,killclient
bind=ALT,F4,killclient

# Focus (vim-style)

bind=SUPER,H,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,K,focusdir,up
bind=SUPER,J,focusdir,down
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Swap
bind=SUPER+SHIFT,H,exchange_client,left
bind=SUPER+SHIFT,L,exchange_client,right
bind=SUPER+SHIFT,K,exchange_client,up
bind=SUPER+SHIFT,J,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

bind=ALT,L,viewtoright,0
bind=ALT,H,viewtoleft,0
bind=ALT,Right,viewtoright,0
bind=ALT,Left,viewtoleft,0
bind=ALT+SHIFT,L,tagtoright,0
bind=ALT+SHIFT,H,tagtoleft,0
bind=ALT+SHIFT,Right,tagtoright,0
bind=ALT+SHIFT,Left,tagtoleft,0


# Window state
# bind=SUPER,g,toggleglobal,
# bind=SUPER+ALT,space,togglefloating,
# bind=SUPER,F,togglefullscreen,
# bind=SUPER+SHIFT,F,togglefakefullscreen,
bind=SUPER,I,minimized
bind=SUPER+SHIFT,I,restore_minimized
# bind=ALT,Z,toggle_scratchpad

# Zoom (swap with master) — use separate binding
bind=SUPER+SHIFT,Return,zoom

# Scroller proportion — cycle through presets: 0.45 → 0.95 0.9�� 1.0.8 → 1.0
bind=SUPER,equal,switch_proportion_preset

# Dwindle split
# bind=ALT+SHIFT,Return,dwindle_toggle_split_direction

# ── Workspace / tag navigation ─────────────────────
# View tags
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,0,view,0,0

# Move window to tag
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0

# ── Monitor ────────────────────────────────────────────────────────────────────
bind=SUPER+ALT,Left,focusmon,left
bind=SUPER+ALT,Right,focusmon,right
bind=SUPER+ALT,Up,focusmon,up
bind=SUPER+ALT,Down,focusmon,down
bind=SUPER+ALT+SHIFT,Left,tagmon,left
bind=SUPER+ALT+SHIFT,Right,tagmon,right

# ── Gaps ───────────────────────────────────────────
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# ── Move / resize floating windows ─────────────────
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# ── Mouse binds ────────────────────────────────────
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ── Axis binds (scroll on bar/tags) ────────────────
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# ── Overview ───────────────────────────────────────
bind=SUPER,O,toggleoverview
bind=ALT+SHIFT,Tab,togglejump