# ───────────────────────────────────────────────────
# Input — keyboard, mouse, trackpad
# ───────────────────────────────────────────────────

# ── Keyboard ───────────────────────────────────────
repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=us

# ── Mouse ──────────────────────────────────────────
mouse_natural_scrolling=0
mouse_accel_profile=2              # adaptive
mouse_accel_speed=0.0

# ── Trackpad ───────────────────────────────────────
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=0
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
trackpad_accel_profile=2
trackpad_accel_speed=0.0
trackpad_scroll_method=1           # two-finger
trackpad_click_method=1            # button areas
trackpad_send_events_mode=0

# ── Focus behavior ─────────────────────────────────
sloppyfocus=1                      # focus follows mouse
warpcursor=1                       # warp cursor on kb focus
focus_on_activate=1
focus_cross_monitor=0
focus_cross_tag=0
view_current_to_back=1