# monarch desktop: foot terminal (Alt+Enter). Black, white, one red accent.
# Copied to ~/.config/foot/ by monarch-add-desktop (only if you have none).
# All options: man foot.ini

[main]
font=JetBrains Mono:size=11
pad=16x14
term=foot

[cursor]
style=block
blink=no

[colors-dark]
background=000000
foreground=e6e6e6
regular0=1f1f1f
regular1=d71921
regular2=bdbdbd
regular3=d9d9d9
regular4=8c8c8c
regular5=a6a6a6
regular6=cfcfcf
regular7=e6e6e6
bright0=4d4d4d
bright1=ff3b43
bright2=ffffff
bright3=ffffff
bright4=b3b3b3
bright5=cccccc
bright6=e6e6e6
bright7=ffffff
cursor=000000 d71921
selection-foreground=000000
selection-background=e6e6e6
