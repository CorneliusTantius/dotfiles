# monarch desktop: fuzzel launcher (Ctrl+Space). Black, white, one red accent.
# Copied to ~/.config/fuzzel/ by monarch-add-desktop (only if you have none).
# All options: man fuzzel.ini (or https://codeberg.org/dnkl/fuzzel)

[main]
font=JetBrains Mono:size=13
prompt="> "
terminal=foot
layer=overlay
width=44
lines=8
horizontal-pad=28
vertical-pad=22
inner-pad=10
icons-enabled=no
fields=name,generic,keywords

# Colors are RRGGBBAA
[colors]
background=000000f2
text=ffffffff
prompt=d71921ff
placeholder=6b6b6bff
input=ffffffff
match=d71921ff
selection=1f1f1fff
selection-text=ffffffff
selection-match=d71921ff
border=262626ff

[border]
width=1
radius=18
